spring:
  application:
    name: features
  datasource:
    url: jdbc:mysql://localhost:3306/springboot_features
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


spring.jpa.properties.hibernate.format_sql: true

spring.devtools.restart.enabled : true
spring.devtools.restart.exclude: com/springboot/features/dto/**
